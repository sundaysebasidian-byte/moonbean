<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonBean</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M21 4a12 12 0 1 0 7 21A10 10 0 0 1 21 4z' fill='%234a5fd8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved) document.documentElement.dataset.theme = saved;
  })();
</script>
</head>
<body>
<header class="top">
  <div class="brand">MoonBean</div>
  <button class="icon-btn" id="theme" type="button" aria-label="主题">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>

<main class="layout">
  <section class="card" id="editor-card">
    <div class="card-head">
      <h2 id="file-name"></h2>
      <div class="actions">
        <button type="button" class="ghost" id="load-example">示例</button>
        <button type="button" class="ghost" id="open-file">打开</button>
        <input type="file" id="file-input" accept=".beancount,.bean,.txt,text/plain" hidden>
      </div>
    </div>
    <div class="editor" id="editor"></div>
  </section>

  <section class="card" id="result-card">
    <div class="summary" id="summary"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="diagnostics">诊断<span class="badge" id="badge" hidden></span></button>
      <button type="button" role="tab" data-tab="reports">报表</button>
      <button type="button" role="tab" data-tab="register">流水</button>
      <button type="button" role="tab" data-tab="query">查询</button>
      <button type="button" role="tab" data-tab="format">格式化</button>
    </div>

    <div class="panel" id="panel-diagnostics" role="tabpanel" hidden>
      <ul class="issues" id="issues"></ul>
    </div>

    <div class="panel" id="panel-reports" role="tabpanel">
      <div class="bar">
        <div class="seg small" id="report-kind">
          <button type="button" data-kind="balance_sheet">资产负债表</button>
          <button type="button" data-kind="income_statement">损益表</button>
          <button type="button" data-kind="trial_balance">试算平衡</button>
        </div>
        <div class="bar-end">
          <span class="tag" id="incomplete" hidden>折算不完整</span>
          <select id="convert" aria-label="折算币种"></select>
          <input id="at" type="date" aria-label="截止日期">
          <button type="button" class="icon-btn small" id="fold" aria-label="展开或收起">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>
          </button>
        </div>
      </div>
      <div class="scroll" id="report"></div>
    </div>

    <div class="panel" id="panel-register" role="tabpanel" hidden>
      <div class="bar">
        <input id="account" class="grow" spellcheck="false" autocomplete="off" list="dl-accounts" aria-label="账户">
        <label class="check"><input type="checkbox" id="subtree" checked>子账户</label>
      </div>
      <div class="scroll" id="register"></div>
    </div>

    <div class="panel" id="panel-query" role="tabpanel" hidden>
      <div class="bar query-bar">
        <textarea id="bql" rows="2" spellcheck="false" aria-label="BQL"></textarea>
        <button type="button" class="primary" id="run">运行</button>
      </div>
      <div class="scroll" id="query-result"></div>
    </div>

    <div class="panel" id="panel-format" role="tabpanel" hidden>
      <div class="bar">
        <span class="muted" id="format-state"></span>
        <div class="bar-end"><button type="button" class="primary" id="apply-format">应用</button></div>
      </div>
      <div class="scroll code" id="format-preview"></div>
    </div>
  </section>
</main>

<datalist id="dl-accounts"></datalist>

<script type="module" src="app.js"></script>
</body>
</html>
