name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: check and test (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain version
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --deny-warn --target all

      - name: Build
        run: moon build --target all

      - name: Test
        run: moon test --target all

      - name: Formatting
        run: |
          moon fmt --check

      - name: Generated interfaces are committed
        run: |
          moon info
          git diff --exit-code

      - name: README quick start
        run: |
          moon run cmd/main --target native -- check examples/full-year-2024.beancount
          moon run cmd/main --target native -- bal examples/full-year-2024.beancount --convert CNY
          moon run cmd/main --target native -- query examples/full-year-2024.beancount "SELECT account, sum(units) FROM postings GROUP BY account ORDER BY account"
          moon run cmd/main --target native -- fmt examples/full-year-2024.beancount
          moon run cmd/main --target native -- export examples/full-year-2024.beancount --json

  playground:
    name: playground bundle and smoke test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build bundle
        run: |
          moon update
          scripts/build-web.sh

      - name: Smoke test
        run: node web/smoke.mjs

  oracle:
    name: upstream conformance (beancount 3.2.3)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: |
          moon version --all
          moon update

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run oracle conformance
        env:
          MOONBEAN_ORACLE_VENV: ${{ runner.temp }}/oracle-venv
        run: |
          ./scripts/oracle.sh --markdown | tee conformance.md

      - name: Seeded differential and extended BQL
        env:
          MOONBEAN_ORACLE_VENV: ${{ runner.temp }}/oracle-venv
        run: |
          python3 scripts/random_differential.py --seed 7 --out .oracle-cache/r1/seed-7 --oracle "$MOONBEAN_ORACLE_VENV/bin" --allow-known-extensions
          python3 scripts/random_differential.py --seed 20261101 --out .oracle-cache/r1/seed-20261101 --oracle "$MOONBEAN_ORACLE_VENV/bin" --allow-known-extensions
          python3 scripts/review_differential.py --oracle "$MOONBEAN_ORACLE_VENV/bin"
          python3 scripts/bql_differential.py --oracle "$MOONBEAN_ORACLE_VENV/bin"

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            conformance.md
            .oracle-cache/r1/seed-7/results.json
            .oracle-cache/r1/seed-20261101/results.json
            .oracle-cache/r1/review.json
          if-no-files-found: warn
